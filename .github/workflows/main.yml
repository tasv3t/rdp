name: RDP - 2026

on:
  workflow_dispatch:
    inputs:
      windows_version:
        description: 'Choose Windows version'
        required: true
        default: 'windows-latest'
        type: choice
        options:
          - windows-latest
          - windows-2022
          - windows-2019

permissions:
  contents: read

concurrency:
  group: rdp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secure-rdp:
    name: Secure RDP
    runs-on: ${{ github.event.inputs.windows_version }}
    timeout-minutes: 360

    env:
      MT5_SYMBOL: XAUUSD
      MT5_PERIOD: M1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------------------------------------------
      # 1. RDP user
      # ---------------------------------------------------------------
      - name: System Preparation
        shell: powershell
        env:
          RDP_USER: ${{ secrets.RDP_USERNAME }}
          RDP_PASS: ${{ secrets.RDP_PASSWORD }}
        run: |
          $user = $env:RDP_USER
          $pass = $env:RDP_PASS

          if (-not $user -or -not $pass) {
            throw "RDP_USERNAME / RDP_PASSWORD secrets are not set."
          }

          $securePass = ConvertTo-SecureString $pass -AsPlainText -Force

          if (-not (Get-LocalUser -Name $user -ErrorAction SilentlyContinue)) {
            New-LocalUser -Name $user -Password $securePass `
              -Description "RDP Access User" -PasswordNeverExpires
          }

          if (-not (Get-LocalGroupMember -Group "Administrators" -Member $user -ErrorAction SilentlyContinue)) {
            Add-LocalGroupMember -Group "Administrators" -Member $user
          }

          "RDP_USERNAME=$user" | Out-File -FilePath $env:GITHUB_ENV -Append

      # ---------------------------------------------------------------
      # 2. Enable RDP scoped to Tailscale
      # ---------------------------------------------------------------
      - name: Enable RDP
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' -Value 0

          Get-NetFirewallRule -DisplayGroup "Remote Desktop" | Disable-NetFirewallRule

          New-NetFirewallRule -Name "RDP-Tailscale" -DisplayName "RDP over Tailscale" `
            -Enabled True -Direction Inbound -Protocol TCP -Action Allow `
            -LocalPort 3389 -RemoteAddress 100.64.0.0/10

      # ---------------------------------------------------------------
      # 3. Tailscale  (auth key via env, not command line)
      # ---------------------------------------------------------------
      - name: Install Tailscale
        shell: powershell
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          if (-not $env:TS_AUTHKEY) { throw "TAILSCALE_AUTH_KEY secret is not set." }

          $msi = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile $msi
          Start-Process msiexec.exe -ArgumentList "/i","`"$msi`"","/quiet","/norestart" -Wait

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"
          & $ts up --hostname="gh-rdp-${{ github.run_id }}"

          $tsIp = (& $ts ip -4 | Where-Object { $_ } | Select-Object -First 1).Trim()
          "TAILSCALE_IP=$tsIp" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "RDP ready at: $tsIp (user: $env:RDP_USERNAME)"

      # ---------------------------------------------------------------
      # 4. Install MT5 (portable) with path fallback
      # ---------------------------------------------------------------
      - name: Install MT5
        shell: powershell
        continue-on-error: true
        run: |
          try {
            $installer = "$env:TEMP\mt5setup.exe"
            Invoke-WebRequest -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" -OutFile $installer
            Start-Process -FilePath $installer -ArgumentList "/auto","/path:`"C:\MT5`"" -Wait

            $path = "C:\MT5"
            if (-not (Test-Path "$path\terminal64.exe")) {
              $found = Get-ChildItem "$env:APPDATA\MetaQuotes\Terminal" -Recurse `
                        -Filter terminal64.exe -ErrorAction SilentlyContinue |
                       Select-Object -First 1
              if ($found) { $path = $found.Directory.FullName }
              else { throw "terminal64.exe not found after install." }
            }

            "MT5_PATH=$path" | Out-File -FilePath $env:GITHUB_ENV -Append
            Write-Host "MT5 installed at $path"
          }
          catch {
            Write-Warning "MT5 install failed: $_"
            "MT5_PATH=" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      # ---------------------------------------------------------------
      # 5. Block MT5 Auto-Update
      # ---------------------------------------------------------------
      - name: Block MT5 Auto-Update
        shell: powershell
        continue-on-error: true
        if: env.MT5_PATH != ''
        run: |
          try {
            $deny = New-Object System.Security.AccessControl.FileSystemAccessRule(
              "Everyone", "Write", "Deny")

            function Block-Path($p) {
              if (Test-Path $p) {
                if ((Get-Item $p).PSIsContainer) {
                  Remove-Item "$p\*" -Recurse -Force -ErrorAction SilentlyContinue
                  Remove-Item $p -Force -ErrorAction SilentlyContinue
                }
              }
              New-Item -ItemType File -Path $p -Force | Out-Null
              $acl = Get-Acl $p
              $acl.SetAccessRuleProtection($true, $false)
              $acl.AddAccessRule($deny)
              Set-Acl -Path $p -AclObject $acl
            }

            Block-Path "$env:APPDATA\MetaQuotes\WebInstall"
            Block-Path "$env:MT5_PATH\liveupdate"
            Write-Host "MT5 auto-update blocked."
          }
          catch {
            Write-Warning "Block auto-update failed: $_"
          }

      # ---------------------------------------------------------------
      # 6. Create MT5 Config (login only)
      # ---------------------------------------------------------------
      - name: Create MT5 Config
        shell: powershell
        continue-on-error: true
        if: env.MT5_PATH != ''
        env:
          MT5_LOGIN:    ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER:   ${{ secrets.MT5_SERVER }}
        run: |
          try {
            if (-not $env:MT5_LOGIN -or -not $env:MT5_PASSWORD -or -not $env:MT5_SERVER) {
              throw "MT5_LOGIN / MT5_PASSWORD / MT5_SERVER secrets are not set."
            }

            $configDir = "$env:MT5_PATH\config"
            New-Item -ItemType Directory -Force -Path $configDir | Out-Null

            $lines = @(
              "[Common]"
              "Login=$env:MT5_LOGIN"
              "Password=$env:MT5_PASSWORD"
              "Server=$env:MT5_SERVER"
              "AutoConfiguration=false"
              ""
              "[Experts]"
              "AllowLiveTrading=1"
              "AllowDllImport=0"
              "Enabled=1"
            )

            $autoIni = "$configDir\auto.ini"
            $lines | Set-Content -Path $autoIni -Encoding Unicode

            "MT5_CONFIG=$autoIni" | Out-File -FilePath $env:GITHUB_ENV -Append
            Write-Host "Config written to $autoIni"
          }
          catch {
            Write-Warning "MT5 config failed: $_"
            Write-Warning "Continuing without config - login will be manual."
          }

      # ---------------------------------------------------------------
      # 7. Launch MT5
      # ---------------------------------------------------------------
      - name: Launch MT5
        shell: powershell
        continue-on-error: true
        if: env.MT5_PATH != ''
        run: |
          try {
            $exe = "$env:MT5_PATH\terminal64.exe"
            if (-not (Test-Path $exe)) { throw "terminal64.exe not found." }

            $args = @("/portable","/skipupdate")
            if ($env:MT5_CONFIG) { $args += "/config:`"$env:MT5_CONFIG`"" }

            Start-Process -FilePath $exe -ArgumentList $args -WorkingDirectory $env:MT5_PATH
            Start-Sleep -Seconds 30

            if (Get-Process terminal64 -ErrorAction SilentlyContinue) {
              Write-Host "MT5 launched."
            }
            else {
              Write-Warning "MT5 process not detected."
            }

            # Remove config that contains plaintext password
            if ($env:MT5_CONFIG) {
              Remove-Item $env:MT5_CONFIG -Force -ErrorAction SilentlyContinue
            }
          }
          catch {
            Write-Warning "MT5 launch failed: $_"
            Write-Warning "Continuing without MT5."
          }

      # ---------------------------------------------------------------
      # 8. RDP info (always)
      # ---------------------------------------------------------------
      - name: RDP Info
        shell: powershell
        if: always()
        run: |
          Write-Host "=========================================="
          Write-Host " RDP is READY"
          Write-Host "=========================================="
          Write-Host " Tailscale IP : $env:TAILSCALE_IP"
          Write-Host " Username     : $env:RDP_USERNAME"
          Write-Host " Port         : 3389"
          Write-Host "=========================================="
          if ($env:MT5_PATH) { Write-Host " MT5          : $env:MT5_PATH" }
          else                { Write-Host " MT5          : not installed (skipped)" }
          Write-Host "=========================================="

      # ---------------------------------------------------------------
      # 9. Keep alive (~5h30m, safely under 6h timeout)
      # ---------------------------------------------------------------
      - name: Keep Alive
        shell: powershell
        if: always()
        run: |
          $endTime = (Get-Date).AddMinutes(330)
          while ((Get-Date) -lt $endTime) {
            Start-Sleep -Seconds 60
          }