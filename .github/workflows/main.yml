name: RDP - 2026

on:
  workflow_dispatch:
    inputs:
      windows_version:
        description: 'Choose Windows version'
        required: true
        default: 'windows-latest'
        type: choice
        options:
          - windows-latest
          - windows-2022
          - windows-2019

permissions:
  contents: read

concurrency:
  group: rdp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secure-rdp:
    runs-on: ${{ github.event.inputs.windows_version }}
    timeout-minutes: 360

    env:
      MT5_SYMBOL: XAUUSD
      MT5_PERIOD: M1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------------------------------------------
      # 1. RDP user
      # ---------------------------------------------------------------
      - name: System Preparation
        shell: powershell
        env:
          RDP_USER: ${{ secrets.RDP_USERNAME }}
          RDP_PASS: ${{ secrets.RDP_PASSWORD }}
        run: |
          $user = $env:RDP_USER
          $pass = $env:RDP_PASS

          if (-not $user -or -not $pass) {
            throw "RDP_USERNAME / RDP_PASSWORD secrets are not set."
          }

          $securePass = ConvertTo-SecureString $pass -AsPlainText -Force

          if (-not (Get-LocalUser -Name $user -ErrorAction SilentlyContinue)) {
            New-LocalUser -Name $user -Password $securePass `
              -Description "RDP Access User" -PasswordNeverExpires
          }

          if (-not (Get-LocalGroupMember -Group "Administrators" -Member $user -ErrorAction SilentlyContinue)) {
            Add-LocalGroupMember -Group "Administrators" -Member $user
          }

          "RDP_USERNAME=$user" | Out-File -FilePath $env:GITHUB_ENV -Append

      # ---------------------------------------------------------------
      # 2. Enable RDP scoped to Tailscale
      # ---------------------------------------------------------------
      - name: Enable RDP
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' -Value 0

          Get-NetFirewallRule -DisplayGroup "Remote Desktop" | Disable-NetFirewallRule

          New-NetFirewallRule -Name "RDP-Tailscale" -DisplayName "RDP over Tailscale" `
            -Enabled True -Direction Inbound -Protocol TCP -Action Allow `
            -LocalPort 3389 -RemoteAddress 100.64.0.0/10

      # ---------------------------------------------------------------
      # 3. Tailscale
      # ---------------------------------------------------------------
      - name: Install Tailscale
        shell: powershell
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          if (-not $env:TS_AUTHKEY) { throw "TAILSCALE_AUTH_KEY secret is not set." }

          $msi = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile $msi
          Start-Process msiexec.exe -ArgumentList "/i","`"$msi`"","/quiet","/norestart" -Wait

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"
          & $ts up --authkey=$env:TS_AUTHKEY --hostname="gh-rdp-${{ github.run_id }}"

          $tsIp = (& $ts ip -4 | Select-Object -First 1).Trim()
          "TAILSCALE_IP=$tsIp" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "RDP ready at: $tsIp (user: $env:RDP_USERNAME)"

      # ---------------------------------------------------------------
      # 4. Install MT5 (portable)
      # ---------------------------------------------------------------
      - name: Install MT5
        shell: powershell
        continue-on-error: true
        run: |
          try {
            $installer = "$env:TEMP\mt5setup.exe"
            Invoke-WebRequest -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" -OutFile $installer
            Start-Process -FilePath $installer -ArgumentList "/auto","/path:`"C:\MT5`"" -Wait

            if (-not (Test-Path "C:\MT5\terminal64.exe")) {
              throw "terminal64.exe not found after install."
            }
            "MT5_PATH=C:\MT5" | Out-File -FilePath $env:GITHUB_ENV -Append
            Write-Host "MT5 installed at C:\MT5"
          }
          catch {
            Write-Warning "MT5 install failed: $_"
            Write-Warning "Continuing without MT5 - RDP will still work."
          }

      # ---------------------------------------------------------------
      # 5. Block auto-update (only if MT5 installed)
      # ---------------------------------------------------------------
      - name: Block MT5 Auto-Update
        shell: powershell
        continue-on-error: true
        if: env.MT5_PATH != ''
        run: |
          try {
            $deny = New-Object System.Security.AccessControl.FileSystemAccessRule(
              "Everyone", "Write", "Deny")

            function Block-Path($p) {
              if (Test-Path $p) {
                if ((Get-Item $p).PSIsContainer) {
                  Remove-Item "$p\*" -Recurse -Force -ErrorAction SilentlyContinue
                  Remove-Item $p -Force -ErrorAction SilentlyContinue
                }
              }
              New-Item -ItemType File -Path $p -Force | Out-Null
              $acl = Get-Acl $p
              $acl.SetAccessRuleProtection($true, $false)
              $acl.AddAccessRule($deny)
              Set-Acl -Path $p -AclObject $acl
            }

            Block-Path "$env:APPDATA\MetaQuotes\WebInstall"
            Block-Path "$env:MT5_PATH\liveupdate"
            Write-Host "MT5 auto-update blocked."
          }
          catch {
            Write-Warning "Block auto-update failed: $_"
          }

      # ---------------------------------------------------------------
      # 6. Install EA (skip if MT5 missing or EA file missing)
      # ---------------------------------------------------------------
      - name: Install EA
        shell: powershell
        continue-on-error: true
        if: env.MT5_PATH != ''
        run: |
          try {
            $src = "ea\MyEA.ex5"
            if (-not (Test-Path $src)) {
              throw "EA not found at $src."
            }

            $dstDir = "$env:MT5_PATH\MQL5\Experts"
            New-Item -ItemType Directory -Force -Path $dstDir | Out-Null
            Copy-Item $src -Destination $dstDir -Force
            Write-Host "EA installed at $dstDir\MyEA.ex5"
          }
          catch {
            Write-Warning "EA install failed: $_"
            Write-Warning "Continuing without EA."
          }

      # ---------------------------------------------------------------
      # 7. MT5 config (skip if MT5 missing)
      # ---------------------------------------------------------------
      - name: Create MT5 Config
        shell: powershell
        continue-on-error: true
        if: env.MT5_PATH != ''
        env:
          MT5_LOGIN:    ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER:   ${{ secrets.MT5_SERVER }}
        run: |
          try {
            if (-not $env:MT5_LOGIN -or -not $env:MT5_PASSWORD -or -not $env:MT5_SERVER) {
              throw "MT5_LOGIN / MT5_PASSWORD / MT5_SERVER secrets are not set."
            }

            $configDir = "$env:MT5_PATH\config"
            New-Item -ItemType Directory -Force -Path $configDir | Out-Null

            $autoIni = "$configDir\auto.ini"
            @(
              "[Common]"
              "Login=$env:MT5_LOGIN"
              "Password=$env:MT5_PASSWORD"
              "Server=$env:MT5_SERVER"
              "AutoConfiguration=false"
              ""
              "[StartUp]"
              "Expert=Experts\MyEA.ex5"
              "Symbol=$env:MT5_SYMBOL"
              "Period=$env:MT5_PERIOD"
            ) | Set-Content -Path $autoIni -Encoding Unicode

            $commonIni = "$configDir\common.ini"
            @(
              "[Experts]"
              "AllowLiveTrading=1"
              "Enabled=1"
            ) | Set-Content -Path $commonIni -Encoding Unicode

            "MT5_CONFIG=$autoIni" | Out-File -FilePath $env:GITHUB_ENV -Append
            Write-Host "Config written to $autoIni"
          }
          catch {
            Write-Warning "MT5 config failed: $_"
            Write-Warning "Continuing without config - login will be manual."
          }

      # ---------------------------------------------------------------
      # 8. Launch MT5 (never fail the job)
      # ---------------------------------------------------------------
      - name: Launch MT5
        shell: powershell
        continue-on-error: true
        if: env.MT5_PATH != ''
        run: |
          try {
            $exe = "$env:MT5_PATH\terminal64.exe"
            if (-not (Test-Path $exe)) { throw "terminal64.exe not found." }

            $args = @("/portable","/skipupdate")
            if ($env:MT5_CONFIG) { $args += "/config:`"$env:MT5_CONFIG`"" }

            Start-Process -FilePath $exe -ArgumentList $args -WorkingDirectory $env:MT5_PATH
            Start-Sleep -Seconds 30

            if (Get-Process terminal64 -ErrorAction SilentlyContinue) {
              Write-Host "MT5 launched."
            } else {
              Write-Warning "MT5 process not detected - will verify in next step."
            }
          }
          catch {
            Write-Warning "MT5 launch failed: $_"
            Write-Warning "Continuing without MT5."
          }

      # ---------------------------------------------------------------
      # 9. Verify EA - WARN ONLY, NEVER FAILS THE JOB
      # ---------------------------------------------------------------
      - name: Verify EA Attached
        shell: powershell
        continue-on-error: true
        if: env.MT5_PATH != ''
        run: |
          $ok = $false

          try {
            $deadline = (Get-Date).AddMinutes(5)
            $logs = @()

            while ((Get-Date) -lt $deadline) {
              $logs  = @()
              $logs += Get-ChildItem "$env:MT5_PATH\Logs"      -Filter *.log -ErrorAction SilentlyContinue
              $logs += Get-ChildItem "$env:MT5_PATH\MQL5\Logs" -Filter *.log -ErrorAction SilentlyContinue
              if ($logs.Count -gt 0) { break }
              Start-Sleep -Seconds 15
            }

            if ($logs.Count -eq 0) {
              Write-Warning "No MT5 logs after 5 minutes - EA/terminal may not have started."
            }
            else {
              foreach ($log in ($logs | Sort-Object LastWriteTime -Descending | Select-Object -First 3)) {
                Write-Host "----- $($log.FullName) (last 40 lines) -----"
                Get-Content -LiteralPath $log.FullName -Tail 40
              }

              $combined = ($logs | ForEach-Object {
                Get-Content -LiteralPath $_.FullName -Raw -ErrorAction SilentlyContinue
              }) -join "`n"

              if ($combined -match "unknown symbol|cannot find symbol|symbol not found") {
                Write-Warning "MT5 rejected symbol '$env:MT5_SYMBOL'. EA may not run."
              }
              elseif ($combined -match "MyEA") {
                Write-Host "EA verification passed."
                $ok = $true
              }
              else {
                Write-Warning "EA 'MyEA' not seen in logs - may not have attached."
              }
            }
          }
          catch {
            Write-Warning "Verification step error: $_"
          }

          if (-not $ok) {
            Write-Warning "EA verification did not pass - RDP continues normally."
          }

          # Always exit 0
          exit 0

      # ---------------------------------------------------------------
      # 10. Always print RDP info right before keep-alive
      # ---------------------------------------------------------------
      - name: RDP Info
        shell: powershell
        if: always()
        run: |
          Write-Host "=========================================="
          Write-Host " RDP is READY"
          Write-Host "=========================================="
          Write-Host " Tailscale IP : $env:TAILSCALE_IP"
          Write-Host " Username     : $env:RDP_USERNAME"
          Write-Host " Port         : 3389"
          Write-Host "=========================================="
          if ($env:MT5_PATH) {
            Write-Host " MT5 installed at: $env:MT5_PATH"
          } else {
            Write-Host " MT5 not installed (skipped)."
          }

      # ---------------------------------------------------------------
      # 11. Keep alive
      # ---------------------------------------------------------------
      - name: Keep Alive
        shell: powershell
        if: always()
        run: |
          $endTime = (Get-Date).AddHours(6)
          while ((Get-Date) -lt $endTime) {
            Start-Sleep -Seconds 60
          }
